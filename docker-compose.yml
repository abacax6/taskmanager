services:
  mongodb:
    image: mongo:latest
    container_name: taskmanager-mongo

    ports:
      - "27017:27017"

    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123

    volumes:
      - mongodb_data:/data/db

  api:
    build: .
    container_name: taskmanager-api

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      - mongodb

volumes:
  mongodb_data: